<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page Not Found · Abdullah AL-Ghoul</title>
  <meta name="description" content="The page you're looking for doesn't exist." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='monospace' font-size='42' font-weight='700' fill='%2306b6d4'%3E%26gt;_%3C%2Ftext%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .error-container { text-align: center; max-width: 520px; }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .error-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    .error-desc { color: var(--text-dim); margin-bottom: 2rem; }
    .error-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .lang-pill {
      position: fixed; top: 1rem; inset-inline-end: 1rem; z-index: 10;
    }
  </style>
</head>
<body>
  <button class="icon-btn lang-pill" id="lang-toggle" aria-label="Switch language" title="Switch language">
    <span id="lang-label">AR</span>
  </button>
  <main class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title" data-i18n="title">Page not found</h1>
    <p class="error-desc" data-i18n="desc">
      The page you're looking for doesn't exist or has been moved.
      Let's get you back on track.
    </p>
    <div class="error-actions">
      <a class="btn btn-primary" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        <span data-i18n="home">Back to home</span>
      </a>
      <a class="btn btn-ghost" href="mailto:abdallhalghoul200@gmail.com">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <span data-i18n="contact">Contact me</span>
      </a>
    </div>
  </main>
  <script>
    (function () {
      const dict = {
        en: {
          title: 'Page not found',
          desc: "The page you're looking for doesn't exist or has been moved. Let's get you back on track.",
          home: 'Back to home',
          contact: 'Contact me'
        },
        ar: {
          title: 'الصفحة غير موجودة',
          desc: 'الصفحة التي تبحث عنها غير موجودة أو تم نقلها. خلّنا نوصلك للمسار الصحيح.',
          home: 'العودة للرئيسية',
          contact: 'تواصل معي'
        }
      };
      const stored = localStorage.getItem('lang') || (navigator.language?.startsWith('ar') ? 'ar' : 'en');
      const lang = stored === 'ar' ? 'ar' : 'en';
      const label = document.getElementById('lang-label');
      function applyLang(l) {
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') || 'dark');
        if (label) label.textContent = l === 'en' ? 'AR' : 'EN';
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const k = el.getAttribute('data-i18n');
          if (dict[l][k]) el.textContent = dict[l][k];
        });
        document.title = (l === 'ar' ? 'صفحة غير موجودة · ' : '404 · Page Not Found · ') + 'Abdullah AL-Ghoul';
      }
      applyLang(lang);
      const btn = document.getElementById('lang-toggle');
      if (btn) {
        btn.addEventListener('click', () => {
          const next = document.documentElement.lang === 'ar' ? 'en' : 'ar';
          localStorage.setItem('lang', next);
          applyLang(next);
        });
      }
    })();
  </script>
</body>
</html>
